<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK BHAI - Market Analysis & Genuine Results</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #e6edf3;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Subtle Luxury Radial Glow */
        body::before {
            content: '';
            position: absolute;
            top: -15%;
            left: 50%;
            transform: translateX(-50%);
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 30px 16px;
            text-align: center;
            margin: auto;
            position: relative;
            z-index: 1;
        }

        /* Classic Luxury Card */
        .card {
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 20px;
            padding: 35px 22px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        /* Gold Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            color: #d4af37;
            margin-bottom: 22px;
            letter-spacing: 0.5px;
        }

        .gold-dot {
            width: 7px;
            height: 7px;
            background-color: #d4af37;
            border-radius: 50%;
            box-shadow: 0 0 8px #d4af37;
        }

        /* Classic Title */
        h1 {
            font-family: 'Cinzel', serif;
            font-size: 38px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #FFF 0%, #D4AF37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 15px;
            font-weight: 500;
            color: #8b949e;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Classic Gold Bordered Feature Box */
        .features {
            text-align: left;
            margin: 22px 0;
            background: rgba(13, 17, 23, 0.6);
            border-left: 3px solid #d4af37;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 18px 18px;
            border-radius: 12px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 14px;
            font-size: 14px;
            font-weight: 500;
            color: #c9d1d9;
        }

        .feature-item:last-child {
            margin-bottom: 0;
        }

        .check-icon {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 22px;
            height: 22px;
            background: rgba(212, 175, 55, 0.15);
            color: #d4af37;
            border-radius: 50%;
            margin-right: 12px;
            font-size: 13px;
            font-weight: bold;
            flex-shrink: 0;
        }

        /* High CTR WhatsApp Button */
        .cta-button {
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            border-radius: 50px;
            color: #ffffff;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            padding: 16px 22px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 22px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3);
            border: none;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(37, 211, 102, 0.45);
        }

        .cta-button:active {
            transform: translateY(1px);
        }

        /* Subtext */
        .sub-text {
            font-size: 12px;
            color: #8b949e;
            margin-top: 12px;
            font-weight: 400;
        }

        /* Footer */
        footer {
            padding: 20px;
            font-size: 12px;
            color: #8b949e;
            text-align: center;
            width: 100%;
            z-index: 1;
        }

        footer a {
            color: #58a6ff;
            text-decoration: none;
            font-weight: 600;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
